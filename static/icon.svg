<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#innerGlow)" stroke-width="4"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Outer Octagon / Shield Sanctuary -->
    <path d="M150 20 L270 70 L270 230 L150 280 L30 230 L30 70 Z" fill="none" stroke="url(#crestGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Central Mind & Reflection Star -->
    <path d="M150 50 C150 110 190 150 250 150 C190 150 150 190 150 250 C150 190 110 150 50 150 C110 150 150 110 150 50 Z" fill="url(#crestGrad)" />
    
    <!-- Core Spark -->
    <circle cx="150" cy="150" r="18" fill="#ffffff" />
  </g>
</svg>